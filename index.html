<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#3d3470">
<title>致 小孙同学</title>
<style>
:root{
  --paper:#fffaf3;
  --ink:#3a2b2b;
  --ink-soft:#6b5566;
  --accent:#c44569;
  --accent-soft:#e8a0b4;
  --gold:#b8860b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:linear-gradient(180deg,#ffe0ec 0%,#f5c4d6 18%,#e0a8c8 38%,#b589bb 62%,#6d5b95 85%,#3d3470 100%);
  background-attachment:fixed;
  font-family:'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;
  min-height:100vh;min-height:100svh;
  overflow-x:hidden;
  position:relative;
}
#sakura{position:fixed;inset:0;z-index:1;pointer-events:none}

/* ===== 信封封面 ===== */
.envelope-stage{
  position:relative;z-index:3;
  display:flex;justify-content:center;
  padding:60px 16px 40px;
  transition:opacity .5s ease;
}
.envelope-stage.fading{opacity:0;pointer-events:none}
.envelope{
  position:relative;width:100%;max-width:360px;
  background:var(--paper);border-radius:14px;
  box-shadow:0 24px 70px rgba(60,30,80,.32),0 4px 14px rgba(0,0,0,.1);
  border:1px solid rgba(255,255,255,.5);
  transform-origin:center;
  transition:transform .8s ease,opacity .6s ease;
}
.envelope-stage.fading .envelope{transform:translateY(-70px) scale(.92);opacity:0}
.cover-art{
  display:block;width:100%;height:340px;object-fit:contain;
  background:linear-gradient(160deg,#ffe0ec 0%,#e0a8c8 45%,#6d5b95 80%,#3d3470 100%);
  padding:8px 0 0;border-radius:14px 14px 0 0;
}
.cover-body{padding:20px 22px 30px;text-align:center;position:relative;border-radius:0 0 14px 14px}
.cover-body h1{
  font-family:'KaiTi','楷体','STKaiti','FangSong','仿宋',serif;
  font-size:1.7rem;font-weight:700;color:var(--accent);letter-spacing:5px;
}
.cover-body .date{font-size:.72rem;color:var(--ink-soft);letter-spacing:2px;margin-top:6px}
.cover-body .sub{
  font-family:'KaiTi','楷体','STKaiti',serif;font-style:italic;
  color:var(--ink-soft);font-size:.86rem;margin-top:10px;line-height:1.6;
}
.wax-seal{
  position:absolute;left:50%;bottom:-34px;transform:translateX(-50%);
  width:74px;height:74px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#d6536e,#7a1a1a);
  box-shadow:0 6px 18px rgba(122,26,26,.55),inset 0 0 12px rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;
  color:#ffe8ef;font-size:1.7rem;font-family:serif;cursor:pointer;
  border:2px solid rgba(255,255,255,.35);
  animation:sealPulse 2.4s ease-in-out infinite;
  transition:transform .4s;
  z-index:4;
}
.wax-seal:active{transform:translateX(-50%) scale(.92)}
@keyframes sealPulse{0%,100%{box-shadow:0 6px 16px rgba(122,26,26,.5),inset 0 0 10px rgba(0,0,0,.35),0 0 0 0 rgba(196,69,105,.4)}50%{box-shadow:0 6px 16px rgba(122,26,26,.5),inset 0 0 10px rgba(0,0,0,.35),0 0 0 14px rgba(196,69,105,0)}}
.wax-seal.broken{animation:sealBreak .5s ease forwards}
@keyframes sealBreak{to{transform:translateX(-50%) scale(0) rotate(45deg);opacity:0}}
.envelope-hint{
  position:relative;z-index:2;text-align:center;margin-top:46px;
  color:rgba(255,255,255,.82);font-size:.8rem;letter-spacing:2px;
  text-shadow:0 1px 4px rgba(0,0,0,.3);
  animation:blink 2.6s infinite;
}
@keyframes blink{0%,100%{opacity:.5}50%{opacity:.95}}

/* ===== 信笺 ===== */
.stage{
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;
  padding:20px 16px 120px;
}
.letter{
  display:none;opacity:0;transform:translateY(30px);
  transition:opacity .7s ease,transform .7s ease;
  position:relative;width:100%;max-width:480px;
  background:var(--paper);
  background-image:
    repeating-linear-gradient(0deg,rgba(120,80,60,.012) 0,rgba(120,80,60,.012) 1px,transparent 1px,transparent 4px),
    radial-gradient(circle at 18% 22%,rgba(200,160,120,.06) 0,transparent 45%),
    radial-gradient(circle at 82% 78%,rgba(200,160,120,.05) 0,transparent 45%);
  border-radius:14px;
  box-shadow:0 24px 70px rgba(60,30,80,.28),0 4px 14px rgba(0,0,0,.08);
  padding:46px 30px 38px;
  border:1px solid rgba(255,255,255,.5);
  overflow:hidden;
}
.letter::before{content:"";position:absolute;inset:8px;border:1px solid rgba(196,69,105,.18);border-radius:8px;pointer-events:none}
.letter.shown{display:block}
.letter.visible{opacity:1;transform:translateY(0)}
.letter .seal{
  position:absolute;top:-14px;right:24px;width:46px;height:46px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#d6536e,#9b2226);
  box-shadow:0 4px 12px rgba(155,34,38,.4),inset 0 0 8px rgba(0,0,0,.3);
  display:flex;align-items:center;justify-content:center;color:#ffe8ef;font-size:1.1rem;font-family:serif;transform:rotate(-12deg);
}
.head{text-align:center;margin-bottom:22px}
.recipient{font-family:'KaiTi','楷体','STKaiti','FangSong','仿宋',serif;font-size:1.7rem;font-weight:700;color:var(--accent);letter-spacing:4px}
.date{font-size:.72rem;color:var(--ink-soft);letter-spacing:2px;margin-top:6px}
.quote{
  margin:18px auto 22px;max-width:320px;
  font-family:'KaiTi','楷体','STKaiti',serif;font-style:italic;
  color:var(--ink-soft);font-size:.9rem;line-height:1.7;position:relative;padding:6px 0;
}
.quote::before,.quote::after{content:"";display:block;width:40px;height:1px;margin:8px auto;background:linear-gradient(90deg,transparent,var(--accent-soft),transparent)}
.body{
  font-family:'KaiTi','楷体','STKaiti','FangSong','仿宋','Georgia',serif;
  font-size:1.02rem;line-height:2;color:var(--ink);letter-spacing:1px;white-space:pre-wrap;min-height:120px;
}
.caret::after{content:"▌";color:var(--accent);animation:blink 1s steps(2) infinite;margin-left:1px}
.wishes{margin:20px 0 6px;display:flex;flex-direction:column;gap:7px}
.wish{font-family:'KaiTi','楷体','STKaiti',serif;font-size:1rem;color:var(--ink);opacity:0;transform:translateX(-8px);animation:wishIn .6s ease forwards}
@keyframes wishIn{to{opacity:1;transform:translateX(0)}}
.wish .em{font-size:1.15rem;margin-right:10px}
.coda{margin-top:22px;padding-top:16px;border-top:1px dashed rgba(196,69,105,.25);font-family:'KaiTi','楷体','STKaiti',serif;text-align:center;color:var(--accent);font-size:1.08rem;font-style:italic;letter-spacing:2px}
.ps-wrap{margin-top:18px;display:none;background:rgba(196,69,105,.05);border-left:3px solid var(--accent-soft);padding:14px 16px;border-radius:0 8px 8px 0}
.ps-label{font-size:.7rem;letter-spacing:3px;color:var(--gold);margin-bottom:6px;text-transform:uppercase}
.ps-text{font-family:'KaiTi','楷体','STKaiti',serif;font-style:italic;color:var(--ink-soft);font-size:.95rem;line-height:1.9;min-height:20px}
.switch{margin-top:24px;display:flex;gap:0;justify-content:center;flex-wrap:wrap;font-size:.82rem;color:var(--ink-soft)}
.switch button{background:rgba(255,255,255,.55);border:1px solid rgba(196,69,105,.2);padding:7px 14px;border-radius:20px;cursor:pointer;font-family:inherit;font-size:.82rem;color:var(--ink-soft);transition:all .25s;backdrop-filter:blur(4px)}
.switch button+button{margin-left:8px}
.switch button:hover,.switch button.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ===== 音乐按钮 ===== */
.music-btn{
  position:fixed;right:18px;bottom:18px;z-index:5;
  width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,.62);border:1px solid rgba(196,69,105,.25);
  color:var(--accent);font-size:1.15rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(60,30,80,.22);backdrop-filter:blur(6px);
  transition:background .25s,color .25s;
}
.music-btn.playing{background:var(--accent);color:#fff;animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== 埋藏层（时效已过） ===== */
.buried-layer{
  position:fixed;inset:0;z-index:50;
  background:linear-gradient(180deg,#2a2438 0%,#1e1a2a 45%,#12101a 100%);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:40px 28px;
  color:#c9b8c4;opacity:0;transition:opacity .8s ease;
}
.buried-layer.show{display:flex;opacity:1}
.buried-layer.fade-out{opacity:0;pointer-events:none}
.buried-layer::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 28%,rgba(120,90,130,.2) 0,transparent 55%);
}
.wilt{width:130px;height:150px;margin-bottom:22px;filter:drop-shadow(0 8px 24px rgba(0,0,0,.55))}
.buried-layer h2{
  font-family:'KaiTi','楷体','STKaiti','FangSong',serif;
  font-size:1.55rem;color:#a89aa8;letter-spacing:10px;margin-bottom:20px;
  text-shadow:0 2px 12px rgba(0,0,0,.5);
}
.buried-layer .epitaph{
  font-family:'KaiTi','楷体','STKaiti',serif;font-size:.98rem;line-height:2.1;
  color:#b8a8b8;max-width:330px;margin:0 auto;letter-spacing:1px;
}
.buried-layer .flower-lang{
  margin-top:22px;font-style:italic;color:#8a7a8a;font-size:.9rem;line-height:1.8;
}
.buried-layer .flower-lang b{color:#c44569;font-weight:400}
.buried-layer .wait{
  margin-top:28px;font-family:'KaiTi','楷体','STKaiti',serif;
  color:#c44569;font-size:1.08rem;letter-spacing:4px;opacity:.88;
}

/* 锁图标后门 */
.lock-icon{
  position:fixed;top:16px;right:16px;z-index:60;
  width:36px;height:36px;border-radius:8px;
  background:transparent;border:1px solid rgba(180,150,180,.12);
  color:rgba(180,150,180,.22);font-size:.95rem;cursor:pointer;
  display:none;align-items:center;justify-content:center;
  transition:color .25s,background .25s,border-color .25s,transform .25s;
}
.lock-icon.show{display:flex}
.lock-icon:hover{color:#c9b8c4;background:rgba(255,255,255,.06);border-color:rgba(180,150,180,.45);transform:rotate(-8deg)}

/* 密码锁模态 */
.lock-modal{
  position:fixed;inset:0;z-index:70;
  background:rgba(8,6,14,.85);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;
  opacity:0;transition:opacity .4s ease;padding:20px;
}
.lock-modal.show{display:flex;opacity:1}
.lock-card{
  background:linear-gradient(160deg,#1a1622 0%,#0e0c16 100%);
  border:1px solid rgba(196,69,105,.3);border-radius:14px;
  padding:30px 26px 24px;text-align:center;
  box-shadow:0 24px 70px rgba(0,0,0,.65),inset 0 0 30px rgba(196,69,105,.04);
  max-width:320px;width:100%;
}
.lock-card h3{
  font-family:'KaiTi','楷体','STKaiti',serif;color:#c9b8c4;
  font-size:1.15rem;letter-spacing:5px;margin-bottom:6px;
}
.lock-card .lock-sub{font-size:.72rem;color:#6a5a6a;margin-bottom:22px;letter-spacing:2px}
.lock-dials{display:flex;justify-content:center;gap:12px;margin-bottom:24px}
.lock-dial{display:flex;flex-direction:column;align-items:center;gap:6px}
.lock-dial button{
  width:46px;height:30px;border-radius:6px;border:1px solid rgba(196,69,105,.22);
  background:rgba(255,255,255,.04);color:#c44569;font-size:.75rem;cursor:pointer;
  transition:background .2s,transform .15s;line-height:1;
}
.lock-dial button:active{transform:scale(.9)}
.lock-dial button:hover{background:rgba(196,69,105,.18)}
.lock-dial .num{
  width:46px;height:58px;border-radius:8px;
  background:linear-gradient(180deg,#0a0810,#1a1422);
  border:1px solid rgba(196,69,105,.3);
  color:#fff;font-size:1.9rem;font-weight:600;
  display:flex;align-items:center;justify-content:center;
  font-family:'Consolas','SF Mono',monospace;
  box-shadow:inset 0 2px 10px rgba(0,0,0,.6);
}
.lock-actions{display:flex;gap:10px;justify-content:center}
.lock-actions button{
  padding:9px 22px;border-radius:22px;border:none;cursor:pointer;
  font-family:inherit;font-size:.85rem;letter-spacing:2px;transition:transform .15s,opacity .2s;
}
.lock-actions button:active{transform:scale(.95)}
.btn-unlock{background:var(--accent);color:#fff}
.btn-cancel{background:rgba(255,255,255,.08);color:#9a8a9a}
.lock-hint{margin-top:14px;font-size:.7rem;color:#5a4a5a;min-height:14px;letter-spacing:1px}
</style>
</head>
<body>
<canvas id="sakura"></canvas>

<section class="envelope-stage" id="envStage">
  <div class="envelope" id="envelope">
    <img class="cover-art" src="cover.jpg" alt="余">
    <div class="cover-body">
      <h1>致　小孙同学</h1>
      <p class="date" id="coverDate"></p>
      <p class="sub">"樱花下落的速度，是每秒五厘米。<br>我该用怎么样的速度去邂逅你？"</p>
    </div>
    <div class="wax-seal" id="waxSeal" role="button" aria-label="开启信封">❀</div>
  </div>
</section>
<p class="envelope-hint" id="envHint">轻触火漆印 · 开启信封 · 乐起</p>

<main class="stage">
  <article class="letter" id="letter">
    <div class="seal">❀</div>
    <header class="head">
      <h1 class="recipient">致　小孙同学</h1>
      <p class="date" id="letterDate"></p>
    </header>
    <p class="quote">"樱花下落的速度，是每秒五厘米。<br>我该用怎么样的速度去邂逅你？"</p>
    <div class="body caret" id="typewriter"></div>
    <div class="wishes" id="wishes"></div>
    <p class="coda">—— 你守着人间烟火，我守着你 ——</p>
    <div class="ps-wrap" id="psWrap">
      <p class="ps-label">— 秘密 P.S. —</p>
      <p class="ps-text" id="psText"></p>
    </div>
    <nav class="switch">
      <button data-mode="full" class="active">完整版</button>
      <button data-mode="short">简短版</button>
      <button data-mode="ps">🌸 秘密</button>
    </nav>
  </article>
</main>

<!-- 埋藏层（时效已过） -->
<div class="buried-layer" id="buried">
  <svg class="wilt" viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="wp" cx="50%" cy="35%">
        <stop offset="0%" stop-color="#8a6a7e"/>
        <stop offset="55%" stop-color="#4a3548"/>
        <stop offset="100%" stop-color="#1f1620"/>
      </radialGradient>
    </defs>
    <path d="M50,60 Q47,92 51,150" stroke="#2a1e2a" stroke-width="2.5" fill="none" opacity=".7" stroke-linecap="round"/>
    <g transform="translate(50,55) rotate(-12)">
      <ellipse cx="0" cy="-16" rx="9" ry="20" fill="url(#wp)" opacity=".85" transform="rotate(0)"/>
      <ellipse cx="0" cy="-16" rx="9" ry="20" fill="url(#wp)" opacity=".85" transform="rotate(45)"/>
      <ellipse cx="0" cy="-16" rx="9" ry="20" fill="url(#wp)" opacity=".85" transform="rotate(90)"/>
      <ellipse cx="0" cy="-16" rx="9" ry="20" fill="url(#wp)" opacity=".85" transform="rotate(135)"/>
      <ellipse cx="0" cy="-16" rx="9" ry="20" fill="url(#wp)" opacity=".85" transform="rotate(180)"/>
      <ellipse cx="0" cy="-16" rx="9" ry="20" fill="url(#wp)" opacity=".85" transform="rotate(225)"/>
      <ellipse cx="0" cy="-16" rx="9" ry="20" fill="url(#wp)" opacity=".85" transform="rotate(270)"/>
      <ellipse cx="0" cy="-16" rx="9" ry="20" fill="url(#wp)" opacity=".85" transform="rotate(315)"/>
      <circle cx="0" cy="0" r="5" fill="#1a1018"/>
    </g>
  </svg>
  <h2>时　效　已　过</h2>
  <p class="epitaph">这是一封有时效的表白信。<br>如果在一定期限里没有被打开，<br>它就会连同心意，一起埋藏起来。</p>
  <p class="flower-lang">——洋桔梗的另一个花语，叫做「<b>无望的爱</b>」</p>
  <p class="wait">等待你喜欢上我的那一天。</p>
</div>

<!-- 锁后门 -->
<button class="lock-icon" id="lockIcon" aria-label="封存的锁">🔒</button>
<div class="lock-modal" id="lockModal">
  <div class="lock-card">
    <h3>封存的信</h3>
    <p class="lock-sub">输入四位数 · 解开封存</p>
    <div class="lock-dials">
      <div class="lock-dial"><button onclick="adj(0,1)" aria-label="加">▲</button><div class="num" id="dial0">0</div><button onclick="adj(0,-1)" aria-label="减">▼</button></div>
      <div class="lock-dial"><button onclick="adj(1,1)" aria-label="加">▲</button><div class="num" id="dial1">0</div><button onclick="adj(1,-1)" aria-label="减">▼</button></div>
      <div class="lock-dial"><button onclick="adj(2,1)" aria-label="加">▲</button><div class="num" id="dial2">0</div><button onclick="adj(2,-1)" aria-label="减">▼</button></div>
      <div class="lock-dial"><button onclick="adj(3,1)" aria-label="加">▲</button><div class="num" id="dial3">0</div><button onclick="adj(3,-1)" aria-label="减">▼</button></div>
    </div>
    <div class="lock-actions">
      <button class="btn-cancel" onclick="closeLock()">取消</button>
      <button class="btn-unlock" onclick="doUnlock()">解锁</button>
    </div>
    <p class="lock-hint" id="lockHint">&nbsp;</p>
  </div>
</div>

<button class="music-btn" id="musicBtn" aria-label="背景音乐">♪</button>
<audio id="bgm" src="bgm.mp3" loop preload="auto"></audio>

<script>
/* ===== 时效埋藏 + 锁后门 ===== */
const DEADLINE = new Date(2026,8,18,23,59,59);  // 9/18 当天有效，之后埋藏
const buried = document.getElementById('buried');
const lockIcon = document.getElementById('lockIcon');
const lockModal = document.getElementById('lockModal');
const lockHint = document.getElementById('lockHint');
let dials = [0,0,0,0];
if(new Date() > DEADLINE){
  buried.classList.add('show');
  lockIcon.classList.add('show');
}
lockIcon.addEventListener('click', ()=>{
  lockModal.classList.add('show');
  lockHint.innerHTML = '&nbsp;';
});
function adj(idx, delta){
  dials[idx] = (dials[idx] + delta + 10) % 10;
  document.getElementById('dial'+idx).textContent = dials[idx];
}
function closeLock(){ lockModal.classList.remove('show'); }
function doUnlock(){
  const code = dials.join('');
  if(code === '1108'){
    lockModal.classList.remove('show');
    buried.classList.add('fade-out');
    setTimeout(()=>{ buried.style.display='none'; openEnvelope(); }, 700);
  } else {
    lockHint.textContent = '封存未解 · 回到主页';
    setTimeout(()=>{ lockModal.classList.remove('show'); lockHint.innerHTML='&nbsp;'; }, 900);
  }
}

const content = {
  full: `小孙同学：

展信安。

看到这封信的时候，我很开心成为了你的男朋友——不是因为父母口中的任务，也不是到了某个年纪自我焦虑催生下的结果。而是我好像突然之间发现，有个人从我的世界路过时，我会想攥住她的手，让她留下来，别走。

我欣赏你的个性。世人大多在社会里逐渐被磨平了棱角，但我在你身上看到了不一样的东西——有的棱角不是用来被磨平的，而是证明自己真真切切在回应这个世界。你身上这份难得的洒脱，让我看你，或许就是在看另一个时空的自己。

虽然你一直说自己是一个比较被动的人，但是我很感谢在过去的时间里，每一次我想见你的时候，你都未曾拒绝过。我不是一个越挫越勇的人，但是想和你见面，是我越来越想做的事。

我们接触的时间并不是很长，甚至你的很多喜好，我也是一知半解，半知不解，阿巴阿巴……两岁的差距仿佛隔着我要奔一奔才能够得到的地方。可能对彼此来说，这会成为我俩相处之间的一场冒险，也是需要磨合的一点。

亲爱的小孙同学，我喜欢你是真心话，所以，大冒险愿意和我一起吗？

（摊牌）我也会因为感情变得扭捏，变得患得患失。在爱情的课题里，做自己一直是一个很苦恼的问题。好在我的原则里，喜欢和自由并不冲突——我没想过困住你，自由是我们与生俱来的权利。

如果可以，我想和你做未来很多个事情：`,

  wishes: [

const wishesEl=document.getElementById('wishes');
const typeEl=document.getElementById('typewriter');
const psWrap=document.getElementById('psWrap');
const psText=document.getElementById('psText');
const envStage=document.getElementById('envStage');
const envHint=document.getElementById('envHint');
const waxSeal=document.getElementById('waxSeal');
const letter=document.getElementById('letter');
const bgm=document.getElementById('bgm');
const musicBtn=document.getElementById('musicBtn');
let opened=false, typing=false, twTimer=null, wishesShown=false, bgmStarted=false;

(function(){
  const d=new Date();
  const ds=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';
  document.getElementById('coverDate').textContent=ds;
  document.getElementById('letterDate').textContent=ds;
})();

/* ===== 开启信封 ===== */
function playBgm(){
  bgm.play().then(()=>{
    musicBtn.classList.add('playing');
  }).catch(()=>{});
}
function openEnvelope(){
  if(opened)return;
  opened=true;
  waxSeal.classList.add('broken');   // 火漆碎裂
  playBgm();                        // 同时 BGM 播放
  envHint.style.opacity='0';
  // 0.5s 后信封淡出
  setTimeout(()=>{
    envStage.classList.add('fading');
  }, 500);
  // 1.0s 后隐藏信封 + 显示信笺
  setTimeout(()=>{
    envStage.style.display='none';
    letter.classList.add('shown');
    requestAnimationFrame(()=>letter.classList.add('visible'));
    setTimeout(showFull, 300);  // 打字机开始
  }, 1000);
}
waxSeal.addEventListener('click',openEnvelope);
// 整个信封也可点（火漆印外的区域）
document.getElementById('envelope').addEventListener('click',e=>{
  if(e.target===waxSeal)return;
  openEnvelope();
});

/* ===== BGM 控制按钮 ===== */
musicBtn.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});
musicBtn.addEventListener('click',e=>{
  e.stopPropagation();
  if(bgm.paused){playBgm()}else{bgm.pause();musicBtn.classList.remove('playing')}
});

/* ===== 打字机 / 心愿 / coda ===== */
function renderWishes(){
  if(wishesShown)return;wishesShown=true;
  content.wishes.forEach((w,i)=>{
    const d=document.createElement('div');
    d.className='wish';d.style.animationDelay=(i*0.5)+'s';
    d.innerHTML='<span class="em">'+w.em+'</span>'+w.t;
    wishesEl.appendChild(d);
  });
}
function startTypewriter(text,cb){
  if(typing&&twTimer){clearTimeout(twTimer)}
  typing=true;typeEl.textContent='';typeEl.classList.add('caret');
  let i=0;
  (function type(){
    if(i<text.length){typeEl.textContent+=text.charAt(i);i++;twTimer=setTimeout(type,52)}
    else{typing=false;typeEl.classList.remove('caret');if(cb)cb()}
  })();
}
function showFull(){
  psWrap.style.display='none';wishesEl.innerHTML='';wishesShown=false;
  startTypewriter(content.full,()=>{renderWishes();setTimeout(()=>startTypewriter(content.coda,null),600)});
}
function showShort(){
  psWrap.style.display='none';wishesEl.innerHTML='';wishesShown=false;
  startTypewriter(content.short,null);
}
function showPS(){
  psWrap.style.display='block';psText.textContent='';
  let i=0;const t=content.ps;
  (function p(){if(i<t.length){psText.textContent+=t.charAt(i);i++;setTimeout(p,58)}})();
}
function switchMode(mode){
  document.querySelectorAll('.switch button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
  if(mode==='full')showFull();else if(mode==='short')showShort();else showPS();
}
document.querySelectorAll('.switch button').forEach(b=>b.addEventListener('click',()=>switchMode(b.dataset.mode)));

/* ===== 樱花飘落 Canvas ===== */
const canvas=document.getElementById('sakura');
const ctx=canvas.getContext('2d');
let W,H,petals=[];
function resize(){
  W=canvas.width=window.innerWidth*devicePixelRatio;
  H=canvas.height=window.innerHeight*devicePixelRatio;
  canvas.style.width=window.innerWidth+'px';
  canvas.style.height=window.innerHeight+'px';
}
function rand(a,b){return a+Math.random()*(b-a)}
function Petal(){this.reset(true)}
Petal.prototype.reset=function(init){
  this.x=rand(0,W);this.y=init?rand(-H,0):rand(-80,-10);
  this.size=rand(14,28)*devicePixelRatio;
  this.rot=rand(0,Math.PI*2);this.rotSpd=rand(-0.02,0.02);
  this.vy=rand(0.6,1.4)*devicePixelRatio;
  this.swayAmp=rand(20,50)*devicePixelRatio;this.swaySpd=rand(0.005,0.015);this.swayPhase=rand(0,Math.PI*2);
  this.alpha=rand(0.6,0.95);
};
Petal.prototype.update=function(){
  this.y+=this.vy;this.swayPhase+=this.swaySpd;this.x+=Math.sin(this.swayPhase)*0.5;this.rot+=this.rotSpd;
  if(this.y>H+40){this.reset(false)}
};
Petal.prototype.draw=function(){
  const s=this.size;ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rot);ctx.globalAlpha=this.alpha;
  for(let i=0;i<5;i++){
    ctx.save();ctx.rotate(i*Math.PI*2/5);
    const g=ctx.createRadialGradient(0,-s*0.18,0,0,-s*0.25,s*0.5);
    g.addColorStop(0,'rgba(255,255,255,0.95)');g.addColorStop(0.45,'rgba(255,200,220,0.85)');g.addColorStop(1,'rgba(255,150,180,0.45)');
    ctx.fillStyle=g;ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.bezierCurveTo(s*0.32,-s*0.18,s*0.22,-s*0.5,0,-s*0.5);
    ctx.bezierCurveTo(-s*0.22,-s*0.5,-s*0.32,-s*0.18,0,0);
    ctx.fill();ctx.restore();
  }
  ctx.fillStyle='rgba(255,225,120,0.85)';ctx.beginPath();ctx.arc(0,0,s*0.07,0,Math.PI*2);ctx.fill();
  ctx.restore();
};
function initPetals(){petals=[];const n=Math.min(46,Math.floor(window.innerWidth/14));for(let i=0;i<n;i++)petals.push(new Petal())}
function loop(){ctx.clearRect(0,0,W,H);for(const p of petals){p.update();p.draw()}requestAnimationFrame(loop)}
window.addEventListener('resize',()=>{resize();initPetals()});
resize();initPetals();loop();
</script>
