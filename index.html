<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#e63946">
<title>写给小孙同学的一封信</title>
<style>
:root{
  --paper:#fdfaf3;
  --envelope:#e63946;
  --envelope-dark:#b91c1c;
  --accent:#457b9d;
  --ink:#2b2d42;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:linear-gradient(135deg,#f8edeb 0%,#fde2e4 100%);
  font-family:'Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:20px;overflow-x:hidden;
}
.paper-texture{
  background-color:var(--paper);
  background-image:
    repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0,rgba(0,0,0,.012) 1px,transparent 1px,transparent 3px),
    radial-gradient(circle at 20% 30%,rgba(180,140,100,.05) 0,transparent 40%),
    radial-gradient(circle at 80% 70%,rgba(180,140,100,.05) 0,transparent 40%);
}
.typewriter-text{
  font-family:'KaiTi','楷体','STKaiti','仿宋','FangSong','Georgia',serif;
  font-size:1.05rem;line-height:2;color:var(--ink);
  letter-spacing:1px;white-space:pre-wrap;
}
.envelope-wrapper{
  position:relative;cursor:pointer;
  transition:transform .6s cubic-bezier(.4,0,.2,1);
  width:350px;height:250px;z-index:10;
}
.envelope{
  position:relative;width:100%;height:100%;
  background:var(--envelope);border-radius:0 0 5px 5px;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
}
.envelope::before{
  content:"";position:absolute;top:0;z-index:2;
  border-left:175px solid transparent;border-right:175px solid transparent;
  border-top:130px solid var(--envelope-dark);transform-origin:top;
  transition:all .5s ease-in-out;
}
.envelope::after{
  content:"";position:absolute;z-index:1;width:0;height:0;
  border-left:175px solid transparent;border-right:175px solid transparent;
  border-bottom:125px solid var(--envelope);bottom:0;
}
.envelope-front{
  position:absolute;width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:3;color:#fff;pointer-events:none;text-align:center;padding:0 20px;
}
.envelope-front h2{font-size:1.5rem;font-weight:700;margin-bottom:6px;font-family:serif}
.envelope-front .date{font-size:.7rem;opacity:.85;letter-spacing:3px;text-transform:uppercase;margin-bottom:14px}
.envelope-front .quote{font-style:italic;font-size:.85rem;opacity:.9;font-family:'KaiTi','楷体',serif}
.letter{
  position:absolute;bottom:0;left:5%;width:90%;height:90%;
  background:var(--paper);border-radius:2px;
  transition:all .7s ease-in-out;
  padding:40px 25px;box-shadow:0 2px 10px rgba(0,0,0,.1);
  z-index:0;overflow-y:auto;transform:translateY(0);
}
.envelope-wrapper.open .envelope::before{transform:rotateX(180deg);z-index:0}
.envelope-wrapper.open .letter{
  transform:translateY(-280px);height:560px;width:110%;left:-5%;z-index:5;
  box-shadow:0 20px 50px rgba(0,0,0,.18);
}
.envelope-wrapper.open{transform:translateY(120px)}
.letter::-webkit-scrollbar{width:5px}
.letter::-webkit-scrollbar-track{background:transparent}
.letter::-webkit-scrollbar-thumb{background:#dcdcdc;border-radius:10px}
.wax-seal{
  width:64px;height:64px;background:#9b2226;border-radius:50%;
  position:absolute;top:-32px;left:calc(50% - 32px);z-index:10;
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 12px rgba(0,0,0,.35),0 4px 10px rgba(0,0,0,.25);
  color:#f1faee;font-size:1.4rem;
}
@keyframes heartbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.heart{color:#e63946;display:inline-block;animation:heartbeat 1.4s infinite}
.hint{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  color:#7a3b3b;font-size:.8rem;opacity:.7;letter-spacing:1px;
  font-family:'KaiTi','楷体',serif;animation:blink 2s infinite;
}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:.85}}
.envelope-wrapper.open ~ .hint{display:none}
.side-nav{
  position:fixed;right:16px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:12px;opacity:0;
  transition:opacity .5s;pointer-events:none;
}
.envelope-wrapper.open ~ .side-nav{opacity:1;pointer-events:auto}
.nav-btn{
  background:#fff;padding:10px 16px;border-radius:50px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);font-size:.85rem;font-weight:600;
  color:var(--accent);transition:all .3s;border:1px solid #eee;cursor:pointer;
  white-space:nowrap;font-family:'PingFang SC','Microsoft YaHei',sans-serif;
}
.nav-btn:hover{background:var(--accent);color:#fff;transform:translateX(-4px)}
.ps-section{margin-top:30px;border-top:1px dashed #e0d6c5;padding-top:18px;display:none}
.ps-label{font-size:.7rem;letter-spacing:3px;color:#b08555;margin-bottom:8px;text-transform:uppercase}
.ps-text{font-family:'KaiTi','楷体',serif;font-style:italic;color:#8b1a1a;font-size:1rem;line-height:1.9}
@media(max-width:420px){
  .envelope-wrapper{width:300px;height:215px}
  .envelope::before{border-left:150px solid transparent;border-right:150px solid transparent;border-top:112px solid var(--envelope-dark)}
  .envelope::after{border-left:150px solid transparent;border-right:150px solid transparent;border-bottom:107px solid var(--envelope)}
  .envelope-wrapper.open .letter{transform:translateY(-260px);height:520px}
  .side-nav{right:8px}
  .nav-btn{padding:8px 12px;font-size:.8rem}
}
</style>
</head>
<body>

<div class="envelope-wrapper" id="envelopeWrapper" onclick="toggleEnvelope()">
  <div class="envelope">
    <div class="envelope-front">
      <h2 id="recipientName">致 小孙同学</h2>
      <p class="date" id="letterDate"></p>
      <p class="quote">"樱花下落的速度，是每秒五厘米。"</p>
    </div>
    <div class="letter paper-texture" id="letterBody" onclick="event.stopPropagation()">
      <div id="typewriterTarget" class="typewriter-text"></div>
      <div class="ps-section" id="psSection">
        <p class="ps-label">— 秘密 P.S. —</p>
        <p class="ps-text" id="psTarget"></p>
      </div>
    </div>
  </div>
  <div class="wax-seal">&#10084;</div>
</div>

<div class="side-nav">
  <button class="nav-btn" onclick="changeContent('full')">完整版本</button>
  <button class="nav-btn" onclick="changeContent('short')">简短版本</button>
  <button class="nav-btn" onclick="revealPS()">秘密 P.S.</button>
</div>

<div class="hint">轻触信封，开启信件</div>

<script>
const content = {
  full: `小孙同学：

展信安。

看到这封信的时候，我很开心成为了你的男朋友——不是因为父母口中的任务，也不是到了某个年纪自我焦虑催生下的结果。而是我好像突然之间发现，有个人从我的世界路过时，我会想攥住她的手，让她留下来，别走。

我欣赏你的个性。世人大多在社会里逐渐被磨平了棱角，但我在你身上看到了不一样的东西——有的棱角不是用来被磨平的，而是证明自己真真切切在回应这个世界。你身上这份难得的洒脱，让我看你，或许就是在看另一个时空的自己。

虽然你一直说自己是一个比较被动的人，但是我很感谢在过去的时间里，每一次我想见你的时候，你都未曾拒绝过。我不是一个越挫越勇的人，但是想和你见面，是我越来越想做的事。

樱花下落的速度是每秒五厘米，我该用怎么样的速度去邂逅你？我们接触的时间并不是很长，甚至你的很多喜好，我也是一知半解，半知不解，阿巴阿巴……两岁的差距仿佛隔着我要奔一奔才能够得到的地方。可能对彼此来说，这会成为我俩相处之间的一场冒险，也是需要磨合的一点。

亲爱的小孙同学，我喜欢你是真心话，所以，大冒险愿意和我一起吗？

（摊牌）我也会因为感情变得扭捏，变得患得患失。在爱情的课题里，做自己一直是一个很苦恼的问题。好在我的原则里，喜欢和自由并不冲突——我没想过困住你，自由是我们与生俱来的权利。

如果可以，我想和你做未来很多个事情：
🍂 一起剪秋天的落叶
🌊 一起牵手走湖边
🫘 一起拼出的豆子拼图
🍜 一起吃同一份食物
⛰️ 一起搀扶着登顶爬山

在往后的日子里，我们是朋友，是恋人，是守候在身旁的一束光。时间慢慢走，只要你回头，我就在你身后。

就像余味居里那盏永远亮着的灯——你守着人间烟火，我守着你。`,

  short: `小孙同学：

展信安。

我喜欢你是真心话，所以，大冒险愿意和我一起吗？

时间慢慢走，只要你回头，我就在你身后。

你守着人间烟火，我守着你。`,

  ps: `P.S. 昨晚完成了初稿，但已经快凌晨两点了。中午尝试写到纸上，看着字迹越看越后悔小时候怎么就没养成好好写字的习惯。遂灵机一动～ 我么有偷懒哦，如果你想看狗爬体的话，吱一声。`
};

let isOpen = false, isTyping = false, currentMode = 'full', twTimer = null;

(function(){
  const d = new Date();
  document.getElementById('letterDate').textContent =
    d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日';
})();

function toggleEnvelope(){
  const w = document.getElementById('envelopeWrapper');
  if(!isOpen){
    w.classList.add('open');
    isOpen = true;
    setTimeout(()=>startTypewriter(content.full), 700);
  }
}

function startTypewriter(text){
  if(isTyping){clearTimeout(twTimer)}
  isTyping = true;
  const target = document.getElementById('typewriterTarget');
  target.innerHTML = '';
  let i = 0;
  function type(){
    if(i < text.length){
      target.innerHTML += text.charAt(i);
      i++;
      twTimer = setTimeout(type, 55);
    } else { isTyping = false; }
  }
  type();
}

function changeContent(mode){
  if(currentMode === mode) return;
  currentMode = mode;
  document.getElementById('psSection').style.display = 'none';
  startTypewriter(content[mode]);
}

function revealPS(){
  const sec = document.getElementById('psSection');
  sec.style.display = 'block';
  const target = document.getElementById('psTarget');
  target.innerHTML = '';
  let i = 0;
  const text = content.ps;
  (function typePS(){
    if(i < text.length){
      target.innerHTML += text.charAt(i);
      i++;
      setTimeout(typePS, 60);
    }
  })();
  const letter = document.getElementById('letterBody');
  setTimeout(()=>letter.scrollTo({top:letter.scrollHeight, behavior:'smooth'}), 500);
}
</script>
</body>
</html>
